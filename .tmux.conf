# ── True color & undercurl support ──────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB"
set -as terminal-overrides ",*:Smulx=\E[4::%p1%dm"  # undercurl
set -as terminal-overrides ",*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m"  # undercurl colors

# ── General settings ───────────────────────────────────────────────
set -g mouse on                    # full mouse support
set -g history-limit 50000         # generous scrollback
set -g base-index 1                # windows start at 1
setw -g pane-base-index 1          # panes start at 1
set -g renumber-windows on         # renumber when closing
set -sg escape-time 10             # low delay after escape
set -g focus-events on             # pass focus events to apps
set -g set-clipboard on            # OSC 52 clipboard integration
set -g status-position top         # status bar at top
set -g detach-on-destroy off       # switch to another session on destroy

# ── Better prefix ──────────────────────────────────────────────────
set -g prefix2 C-a
bind C-a send-prefix -2

# ── Intuitive splits (open in current path) ────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ── Vim-style pane navigation ──────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Pane resizing (repeatable) ─────────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Quick reload ───────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# ── Copy mode (vi style) ──────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

# ── Meta+C / Meta+V copy-paste (works over SSH via OSC 52) ───────
bind -T copy-mode-vi M-c send -X copy-pipe-and-cancel
bind -n M-v paste-buffer

# ── Scroll: mouse wheel enters copy mode and scrolls ─────────────
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"

# ── Clean status bar ──────────────────────────────────────────────
set -g status-style "bg=colour235,fg=colour245"
set -g status-left "#[fg=colour141,bold] #S #[fg=colour245]| "
set -g status-left-length 30
set -g status-right "#[fg=colour245]%H:%M "
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=colour141,bold] #I:#W "
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour141"
set -g message-style "bg=colour235,fg=colour141"
